services:
  ocr-orientation:
    build: .
    image: ocr-orientation:latest
    platform: linux/amd64
    shm_size: "2gb"
    volumes:
      - ./data:/app/data
      - ./test:/app/test
      - ./checkpoints:/app/checkpoints
      - ./output:/app/output
    environment:
      PYTHONHASHSEED: "42"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    stdin_open: true
    tty: true
